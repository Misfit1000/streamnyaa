name: Desktop Release

on:
  workflow_dispatch:
  push:
    branches:
      - desktop

jobs:
  build-windows-installer:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install desktop playback dependencies
        shell: powershell
        run: |
          winget install --id shinchiro.mpv -e --accept-package-agreements --accept-source-agreements
          cargo install tauri-cli --locked
          cargo install rqbit --locked

      - name: Install npm dependencies
        run: npm ci

      - name: Verify desktop app
        shell: powershell
        run: |
          $env:Path = "$env:USERPROFILE\.cargo\bin;$env:Path"
          $env:STREAMNYAA_REQUIRE_BUNDLED_BINARIES = "1"
          npm run verify:desktop-release

      - name: Stage bundled desktop binaries
        shell: powershell
        run: |
          $env:Path = "$env:USERPROFILE\.cargo\bin;$env:Path"
          $env:STREAMNYAA_REQUIRE_BUNDLED_BINARIES = "1"
          npm run prepare:desktop-binaries

      - name: Build desktop installer
        shell: powershell
        run: |
          $env:Path = "$env:USERPROFILE\.cargo\bin;$env:Path"
          npm run desktop:build

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: streamnyaa-desktop-windows
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/*.msi
