<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StreamNyaa - Anime Discovery, Release Schedules and Episode Updates</title>
    <meta name="description" content="StreamNyaa helps anime fans discover seasonal titles, follow anime release schedules, browse episode updates, and search anime metadata from one clean interface." />
    <meta name="keywords" content="anime discovery, anime release schedule, anime episode updates, seasonal anime, anime metadata, anime search, manga details" />
    <meta name="application-name" content="StreamNyaa" />
    <meta name="apple-mobile-web-app-title" content="StreamNyaa" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="shortcut icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <link rel="canonical" href="https://www.streamnyaa.xyz/" />
    <meta property="og:title" content="StreamNyaa - Anime Discovery, Schedules and Torrent Search" />
    <meta property="og:description" content="Discover anime, track release schedules, browse seasonal shows, follow episode updates, and search anime metadata with StreamNyaa." />
    <meta property="og:url" content="https://www.streamnyaa.xyz/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="StreamNyaa" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="StreamNyaa - Anime Discovery and Release Schedules" />
    <meta name="twitter:description" content="Browse anime metadata, release schedules, seasonal shows, and episode updates in one clean interface." />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "StreamNyaa",
        "alternateName": ["Stream Nyaa", "StreamNyaa Anime"],
        "url": "https://www.streamnyaa.xyz/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://www.streamnyaa.xyz/search?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    
    <!-- Preconnect to WebTor related domains -->
    <link rel="preconnect" href="https://webtor.io" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    
    <!-- Preload Webtor SDK to improve player initialization speed -->
    <script id="webtor-sdk" src="https://cdn.jsdelivr.net/npm/@webtor/player-sdk-js/dist/index.min.js" async></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
