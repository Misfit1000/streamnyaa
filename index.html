<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        var isDesktopShell = window.location.search.indexOf('desktop=1') !== -1
          || !/^https?:$/.test(window.location.protocol)
          || window.location.hostname === 'tauri.localhost';

        if (isDesktopShell) {
          document.documentElement.setAttribute('data-streamnyaa-target', 'desktop');
          return;
        }

        var analytics = document.createElement('script');
        analytics.async = true;
        analytics.src = 'https://www.googletagmanager.com/gtag/js?id=G-T6TMP6R1BW';
        document.head.appendChild(analytics);

        window.dataLayer = window.dataLayer || [];
        window.gtag = function(){ dataLayer.push(arguments); };
        window.gtag('js', new Date());
        window.gtag('config', 'G-T6TMP6R1BW');

        var adsense = document.createElement('script');
        adsense.async = true;
        adsense.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3878702638437768';
        adsense.crossOrigin = 'anonymous';
        document.head.appendChild(adsense);
      })();
    </script>
    <title>StreamNyaa</title>
    <meta name="description" content="StreamNyaa helps anime fans find anime downloads, follow release schedules, browse episode updates, and search anime source options from one clean interface." />
    <meta name="keywords" content="anime discovery, anime release schedule, anime episode updates, seasonal anime, anime metadata, anime search, manga details" />
    <meta name="application-name" content="StreamNyaa" />
    <meta name="apple-mobile-web-app-title" content="StreamNyaa" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="shortcut icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <meta property="og:title" content="StreamNyaa" />
    <meta property="og:description" content="Find anime downloads, track release schedules, browse seasonal shows, follow episode updates, and search anime source options with StreamNyaa." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="StreamNyaa" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="StreamNyaa" />
    <meta name="twitter:description" content="Browse anime metadata, release schedules, seasonal shows, and episode updates in one clean interface." />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "StreamNyaa",
        "alternateName": ["Stream Nyaa", "StreamNyaa Anime"],
        "url": "https://www.streamnyaa.xyz/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://www.streamnyaa.xyz/search?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <script>
      (function () {
        var isDesktopShell = window.location.search.indexOf('desktop=1') !== -1
          || !/^https?:$/.test(window.location.protocol)
          || window.location.hostname === 'tauri.localhost';
        if (isDesktopShell) return;

        var siteUrl = 'https://www.streamnyaa.xyz';
        var path = window.location.pathname === '/' ? '/' : window.location.pathname.replace(/\/+$/, '');
        var canonicalUrl = siteUrl + path;
        var canonical = document.createElement('link');
        canonical.rel = 'canonical';
        canonical.href = canonicalUrl;
        document.head.appendChild(canonical);

        var ogUrl = document.createElement('meta');
        ogUrl.setAttribute('property', 'og:url');
        ogUrl.content = canonicalUrl;
        document.head.appendChild(ogUrl);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
